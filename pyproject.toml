[project]
name = "property-search-api"
version = "0.1.0"
description = "Phase 1 property search and retrieval backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2,<3",
  "pydantic-settings>=2,<3",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "chromadb>=0.5,<1",
  "openai>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

